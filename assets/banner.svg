<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="70%" r="65%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#a78bfa"/>
      <stop offset="70%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="wireframeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="wireframeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.5"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(180deg); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(16px) rotate(-180deg); }
    }
    @keyframes rotateWireframe {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 80; }
    }
    @keyframes pillFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pillFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }

    .bg-grid { opacity: 0.8; }
    .orb-1 { animation: floatOrb1 14s ease-in-out infinite; transform-origin: 150px 100px; }
    .orb-2 { animation: floatOrb2 16s ease-in-out infinite; transform-origin: 1050px 300px; }
    .rotating-poly { animation: rotateWireframe 40s linear infinite; transform-origin: 1040px 160px; }
    .dash-line { stroke-dasharray: 6, 6; animation: dashCycle 6s linear infinite; }
    .pill-1 { animation: pillFloat1 6s ease-in-out infinite; }
    .pill-2 { animation: pillFloat2 7s ease-in-out infinite 1s; }
    .pill-3 { animation: pillFloat1 8s ease-in-out infinite 2s; }
  </style>

  <!-- Deep Cosmic Background -->
  <rect width="1200" height="420" fill="#070a13" rx="16"/>
  <rect width="1200" height="420" fill="url(#bgGlow1)" rx="16"/>
  <rect width="1200" height="420" fill="url(#bgGlow2)" rx="16"/>
  <rect width="1200" height="420" fill="url(#bgGlow3)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" class="bg-grid" rx="16"/>

  <!-- Subtle Outer Border -->
  <rect x="1.5" y="1.5" width="1197" height="417" rx="15" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- DYNAMIC BACKGROUND ELEMENTS (Kept strictly behind and to sides) -->
  <!-- Left Decorative 3D Wireframe Cube (Behind / Decorative) -->
  <g class="orb-1" opacity="0.65">
    <polygon points="120,40 180,75 180,145 120,110" fill="url(#wireframeGrad1)" opacity="0.4"/>
    <polygon points="120,40 60,75 60,145 120,110" fill="url(#wireframeGrad2)" opacity="0.3"/>
    <polygon points="120,40 180,75 120,110 60,75" fill="#38bdf8" opacity="0.25"/>
    <!-- Wire lines -->
    <line x1="120" y1="40" x2="180" y2="75" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="180" y1="75" x2="180" y2="145" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="180" y1="145" x2="120" y2="110" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="120" y1="110" x2="60" y2="145" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="60" y1="145" x2="60" y2="75" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="60" y1="75" x2="120" y2="40" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="120" y1="40" x2="120" y2="110" stroke="#c084fc" stroke-width="1.5"/>
  </g>

  <!-- Right Dynamic Rotating Geodesic Polyhedron (Kept right of 920px) -->
  <g class="rotating-poly" opacity="0.55">
    <circle cx="1040" cy="160" r="100" fill="none" stroke="#4f46e5" stroke-width="1" class="dash-line" opacity="0.5"/>
    <polygon points="1040,70 1120,120 1120,200 1040,250 960,200 960,120" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="1040" y1="70" x2="1040" y2="250" stroke="#c084fc" stroke-width="1.2" opacity="0.7"/>
    <line x1="960" y1="120" x2="1120" y2="200" stroke="#818cf8" stroke-width="1.2" opacity="0.7"/>
    <line x1="960" y1="200" x2="1120" y2="120" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
    <circle cx="1040" cy="70" r="4" fill="#67e8f9" filter="url(#glow)"/>
    <circle cx="1120" cy="120" r="4" fill="#a78bfa" filter="url(#glow)"/>
    <circle cx="1120" cy="200" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="1040" cy="250" r="4" fill="#f472b6" filter="url(#glow)"/>
    <circle cx="960" cy="200" r="4" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="960" cy="120" r="4" fill="#60a5fa" filter="url(#glow)"/>
    <circle cx="1040" cy="160" r="5" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed clean view, high z-index, centered) -->
  <g transform="translate(600, 0)">
    <!-- Top Ecosystem Pill -->
    <g class="pill-1">
      <rect x="-175" y="45" width="350" height="32" rx="16" fill="#1e1b4b" fill-opacity="0.8" stroke="#6366f1" stroke-width="1.2"/>
      <circle cx="-150" cy="61" r="5" fill="#22c55e" filter="url(#glow)"/>
      <text x="-135" y="66" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1">CURATED SPATIAL AI REPOSITORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" filter="url(#softGlow)" letter-spacing="-0.5">Awesome 3D Generative AI</text>
    <text x="0" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">Awesome 3D Generative AI</text>

    <!-- Subtitle -->
    <text x="0" y="182" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#f1f5f9" letter-spacing="0.2">&amp; Spatial Modeling Ecosystem</text>

    <!-- Detailed Tagline -->
    <text x="0" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">Text-to-3D • Image-to-3D Diffusion • 3D Gaussian Splatting • Neural Radiance Fields (NeRF) • 3D-as-Code for LLMs</text>

    <!-- Interactive / Floating Category Feature Badges -->
    <g transform="translate(0, 260)">
      <!-- Badge 1: Diffusion & NeRF -->
      <g class="pill-1" transform="translate(-400, 0)">
        <rect x="0" y="0" width="180" height="42" rx="10" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="90" y="26" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Diffusion &amp; NeRF</text>
      </g>

      <!-- Badge 2: 3D Gaussians -->
      <g class="pill-2" transform="translate(-200, 0)">
        <rect x="0" y="0" width="185" height="42" rx="10" fill="url(#cardBg)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="92" y="26" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">✨ 3D Gaussian Splats</text>
      </g>

      <!-- Badge 3: 3D-as-Code for LLMs -->
      <g class="pill-3" transform="translate(5, 0)">
        <rect x="0" y="0" width="195" height="42" rx="10" fill="url(#cardBg)" stroke="#a78bfa" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="97" y="26" text-anchor="middle" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🧠 3D-as-Code for LLMs</text>
      </g>

      <!-- Badge 4: Production Meshes -->
      <g class="pill-1" transform="translate(220, 0)">
        <rect x="0" y="0" width="180" height="42" rx="10" fill="url(#cardBg)" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="90" y="26" text-anchor="middle" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎮 Game-Ready Assets</text>
      </g>
    </g>

    <!-- Bottom Stat Bar -->
    <g transform="translate(0, 345)">
      <line x1="-380" y1="0" x2="380" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.5"/>
      <text x="-260" y="28" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">🏢 <tspan fill="#e2e8f0" font-weight="700">Top SaaS &amp; Enterprise Platforms</tspan></text>
      <text x="0" y="28" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">⭐ <tspan fill="#e2e8f0" font-weight="700">Ranked by Real-Time GitHub Stars</tspan></text>
      <text x="260" y="28" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">🔄 <tspan fill="#e2e8f0" font-weight="700">Updated Regularly</tspan></text>
    </g>
  </g>
</svg>
